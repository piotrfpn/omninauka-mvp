<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background for any/maskable icon -->
  <rect width="512" height="512" rx="112" fill="#0B1220"/>
  
  <!-- Stylized geometric educational AI 'O' shape in the safe center -->
  <g transform="translate(256, 256)">
    <!-- Outer glowing circle or segments representing learning & AI -->
    <!-- Brand Blue Arc -->
    <path d="M -110,-110 A 155,155 0 0,1 110,-110" fill="none" stroke="#4F7CFF" stroke-width="32" stroke-linecap="round"/>
    <!-- Mint CTA Arc -->
    <path d="M 110,-110 A 155,155 0 0,1 110,110" fill="none" stroke="#2EE6A6" stroke-width="32" stroke-linecap="round"/>
    <!-- Cyan AI Arc -->
    <path d="M 110,110 A 155,155 0 0,1 -110,110" fill="none" stroke="#22D3EE" stroke-width="32" stroke-linecap="round"/>
    <!-- Connecting Arc back -->
    <path d="M -110,110 A 155,155 0 0,1 -110,-110" fill="none" stroke="#4F7CFF" stroke-dasharray="10 15" stroke-width="24" stroke-linecap="round"/>

    <!-- Inner element: Stylized book pages or Graduation cap representing education -->
    <!-- Graduation Cap / Diamond Shape -->
    <path d="M 0,-50 L 70,-15 L 0,20 L -70,-15 Z" fill="#F8FAFC"/>
    <!-- Cap tassel -->
    <path d="M 0,20 L 0,45 A 8,8 0 0,0 8,53 L 20,53" fill="none" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round"/>
    <!-- AI Sparkle in the center -->
    <path d="M 0,-15 C 0,-5 5,0 15,0 C 5,0 0,5 0,15 C 0,5 -5,0 -15,0 C -5,0 0,-5 0,-15 Z" fill="#2EE6A6"/>
  </g>
</svg>

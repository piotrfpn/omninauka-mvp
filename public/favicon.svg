<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background matching theme color #0B1220 -->
  <rect width="512" height="512" rx="112" fill="#0B1220"/>
  <!-- Stylized brain / learning connections icon in theme colors -->
  <g transform="translate(106, 106)" fill="none" stroke="#2EE6A6" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left side of brain -->
    <path d="M150,80 C120,40 60,40 40,80 C20,120 20,180 50,220 C80,260 120,260 150,220" />
    <!-- Right side of brain -->
    <path d="M150,80 C180,40 240,40 260,80 C280,120 280,180 250,220 C220,260 180,260 150,220" />
    <!-- Center connection line -->
    <line x1="150" y1="80" x2="150" y2="220" />
    <!-- Node points (glowing dots) -->
    <circle cx="150" cy="80" r="12" fill="#2EE6A6" />
    <circle cx="150" cy="150" r="12" fill="#2EE6A6" />
    <circle cx="150" cy="220" r="12" fill="#2EE6A6" />
    <circle cx="50" cy="150" r="12" fill="#2EE6A6" />
    <circle cx="250" cy="150" r="12" fill="#2EE6A6" />
  </g>
</svg>
